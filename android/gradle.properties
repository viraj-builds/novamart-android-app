org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP 9 turns on R8 strict full mode for keep rules, where a library rule such
# as `-keep class * extends androidx.room.RoomDatabase` no longer keeps the
# no-arg constructor. WorkManager (pulled in by CleverTap and the geofence SDK)
# creates its Room database reflectively, so release APKs crashed at process
# start with NoSuchMethodException: WorkDatabase_Impl.<init>. Debug builds
# (flutter run over USB) skip R8, which is why only shared APKs crashed.
android.r8.strictFullModeForKeepRules=false
