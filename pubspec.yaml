name: sportsphere
description: A production-ready Flutter eCommerce application for sports accessories.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  google_fonts: ^6.1.0
  intl: ^0.18.1
  http: ^1.1.0
  shared_preferences: ^2.2.1
  cached_network_image: ^3.3.0
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  badges: ^3.1.2
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  flutter_dotenv: ^6.0.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  # Pinned to 3.x: clevertap_plugin 4.1.0 applies its own Kotlin Gradle Plugin
  # (KGP 1.8.22 / AGP 8.6.1), which AGP 9.0.1 no longer supports — its Kotlin
  # sources compile only partially and CleverTapEventEmitter /
  # CleverTapListenerProxy fail to resolve. Revisit when the plugin ships an
  # AGP 9 compatible release.
  clevertap_plugin: ^3.8.1
  firebase_messaging: ^15.2.10
  permission_handler: ^11.3.0
  firebase_analytics: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
